<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swagger UI • TaskFlow Logistics API (SESI SENAI)</title>
  <link rel="icon" type="image/png" href="./swagger-ui/favicon-32x32.png" sizes="32x32" />
  <link rel="stylesheet" type="text/css" href="./swagger-ui/swagger-ui.css" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
    }
    .swagger-ui .topbar {
      background-color: #004587 !important; /* Azul institucional SENAI */
    }
    .swagger-ui .topbar .download-url-wrapper .select-label {
      color: #ffffff;
      font-weight: 600;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <!-- Swagger UI Scripts (Locais e Offline-First) -->
  <script src="./swagger-ui/swagger-ui-bundle.js"></script>
  <script src="./swagger-ui/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        urls: [
          { url: "./openapi.json", name: "OpenAPI 3.0 (JSON)" },
          { url: "./openapi.yaml", name: "OpenAPI 3.0 (YAML)" }
        ],
        "urls.primaryName": "OpenAPI 3.0 (JSON)",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        displayRequestDuration: true,
        docExpansion: "list",
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        tryItOutEnabled: true
      });
    };
  </script>
</body>
</html>
